name: PerdePRO 1.0.25 packages

on:
  push:
    branches: [release/perdepro-1.0.25-build]
    paths: [.github/workflows/perdepro-release-package.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/load-release-client-config.mjs
      - run: node --import tsx scripts/check-supplier-share-segments.ts
      - run: node --import tsx scripts/check-calculations.ts
      - run: node --import tsx scripts/check-order-creation.ts
      - run: node --import tsx scripts/check-strict-delete.ts
      - run: npm run electron:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PerdePRO-1.0.25-Windows
          path: release/PerdePRO-Setup-1.0.25.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/load-release-client-config.mjs
      - run: node --import tsx scripts/check-supplier-share-segments.ts
      - run: node --import tsx scripts/check-order-creation.ts
      - run: node --import tsx scripts/check-locked-native.ts
      - run: npm run build && npx cap sync android
      - name: Build Android App Bundle and APK for release signing
        working-directory: android
        run: bash ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PerdePRO-1.0.25-Android-unsigned
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14
