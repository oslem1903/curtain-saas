# PerdePRO - Capacitor 8 iOS build
# Repository: oslem1903/curtain-saas
#
# Proje SPM tabanlidir (Capacitor 8): Podfile/.xcworkspace YOKTUR,
# bu yuzden xcodebuild'e -project verilir ve cocoapods gerekmez.
#
# İKİ IS AKISI:
#   ios-build-check -> imzasiz derleme dogrulamasi. Apple kimlik bilgisi
#                      GEREKTIRMEZ, hicbir yere yukleme YAPMAZ.
#   perdepro-ios    -> imzali IPA. Codemagic'te dagitim sertifikasi +
#                      provisioning profile tanimli olmadan CALISMAZ.

definitions:
  # Tekil adim anchorlari. DIKKAT: bir listeyi tek anchor ile yeniden
  # kullanmak (- *liste) ic ice dizi uretir ve Codemagic ayristiramaz;
  # bu yuzden her adim ayri anchorlanir.
  scripts:
    - &npm_install
      name: Install dependencies
      script: npm ci
    - &web_build
      name: Build web application
      script: npm run build
    - &cap_sync
      name: Synchronize Capacitor iOS project
      script: npx cap sync ios

workflows:
  # ───────────────────────────────────────────────────────────────────
  # 1) Imzasiz derleme dogrulamasi — su an calistirilacak olan budur
  # ───────────────────────────────────────────────────────────────────
  ios-build-check:
    name: PerdePRO iOS (imzasiz derleme kontrolu)
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      node: 24.17.0
      xcode: latest
      # Degerler Codemagic UI > Environment variables altinda saklanir;
      # bu dosyaya yazilmaz.
      groups:
        - perdepro_env

    scripts:
      - *npm_install
      - *web_build
      - *cap_sync

      - name: Archive unsigned (no Apple credentials needed)
        script: |
          set -e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee /tmp/xcodebuild_archive.log

      - name: Verify bundle metadata
        script: |
          set -e
          PLIST="$CM_BUILD_DIR/build/ios/App.xcarchive/Products/Applications/App.app/Info.plist"
          echo "--- Derlenen uygulamanin Info.plist degerleri ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName"      "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"       "$PLIST"

    artifacts:
      - build/ios/App.xcarchive
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_logs/*.log

  # ───────────────────────────────────────────────────────────────────
  # 2) Imzali IPA — Codemagic'te sertifika/profil tanimlandiktan SONRA
  #    Yukleme yok: publishing bolumu bilerek bos birakildi.
  # ───────────────────────────────────────────────────────────────────
  perdepro-ios:
    name: PerdePRO iOS (imzalı IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PerdePRO Codemagic

    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.curtainsaas.app

    scripts:
      - *npm_install
      - *web_build
      - *cap_sync
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-review-simulator:
    name: PerdePRO iOS Simulator (review screenshots)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
    scripts:
      - *npm_install
      - *web_build
      - *cap_sync
      - &ios_sim_build
        name: Build iOS simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/perdepro-simulator-build.log
      - name: Capture genuine iOS login screen
        script: |
          set -euo pipefail
          SIM_ID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          devices = [d for key, group in data['devices'].items() if 'iOS' in key for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          best = next((d for d in devices if '17 Pro Max' in d['name']), next((d for d in devices if 'Pro Max' in d['name']), devices[0]))
          print(best['udid'])
          PY
          )
          mkdir -p "$CM_BUILD_DIR/build/ios-review-screenshots"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIM_ID" "$CM_BUILD_DIR/build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$SIM_ID" com.curtainsaas.app
          # First simulator launch can spend longer loading system/WebKit caches.
          # Keep several real captures so a launch screen is never mistaken for login.
          for CAPTURE in 1 2 3; do
            sleep 30
            xcrun simctl io "$SIM_ID" screenshot "$CM_BUILD_DIR/build/ios-review-screenshots/PerdePRO-iOS-$CAPTURE.png"
          done
          xcrun simctl spawn "$SIM_ID" log show --last 3m --style compact --predicate 'process == "App"' > /tmp/perdepro-simulator-runtime.log 2>&1 || true
          xcrun simctl shutdown "$SIM_ID"
    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
      - build/ios-review-screenshots/*.png
      - /tmp/perdepro-simulator-build.log
      - /tmp/perdepro-simulator-runtime.log

  ios-review-authenticated: &ios_review_authenticated
    name: PerdePRO iOS authenticated review screenshots
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        MAESTRO_DEVICE_FAMILY: iPhone
        MAESTRO_FLOW: tests/ios/review-screenshots.yaml
    scripts:
      - name: Check dedicated demo credentials
        script: |
          set -eu
          if [ "${MAESTRO_DEMO_EMAIL:-}" != "test0924064036@gmail.com" ] || [ -z "${MAESTRO_DEMO_PASSWORD:-}" ]; then
            echo 'Add MAESTRO_DEMO_PASSWORD as a secure variable in perdepro_env. The dedicated Apple Test email is configured by this workflow.'
            exit 1
          fi
      - *npm_install
      - *web_build
      - *cap_sync
      - *ios_sim_build
      - name: Install official Maestro CLI
        script: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
      - name: Capture authenticated iOS module screenshots
        script: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1
          SIM_ID=$(python3 - <<'PYCODE'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          import os
          family = os.environ.get('MAESTRO_DEVICE_FAMILY', 'iPhone')
          devices = [d for key, group in data['devices'].items() if 'iOS' in key for d in group if d.get('isAvailable') and family in d['name']]
          if not devices:
              raise SystemExit('No available simulator for requested family')
          if family == 'iPad':
              best = next((d for d in devices if '13-inch' in d['name'] and 'Pro' in d['name']), devices[0])
          else:
              best = next((d for d in devices if '17 Pro Max' in d['name']), next((d for d in devices if 'Pro Max' in d['name']), devices[0]))
          print(best['udid'])
          PYCODE
          )
          trap 'xcrun simctl shutdown "$SIM_ID" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$CM_BUILD_DIR/build/ios-authenticated-screenshots"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIM_ID" "$CM_BUILD_DIR/build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app"
          # Credentials come from secure MAESTRO_ environment variables, never CLI arguments.
          # Do not publish raw Maestro logs/commands: those can contain test credentials.
          RESULT=0
          maestro --device "$SIM_ID" test --test-output-dir /tmp/perdepro-maestro-private --debug-output /tmp/perdepro-maestro-private "$MAESTRO_FLOW" > /tmp/perdepro-maestro-private.log 2>&1 || RESULT=$?
          maestro --device "$SIM_ID" hierarchy > /tmp/perdepro-private-hierarchy.json 2>/dev/null || true
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, re, shutil
          source = Path('/tmp/perdepro-maestro-private')
          target = Path(os.environ['CM_BUILD_DIR']) / 'build/ios-authenticated-screenshots'
          for image in source.rglob('*.png'):
              if re.fullmatch(r'0[1-9]-[A-Za-z]+\.png', image.name):
                  shutil.copy2(image, target / image.name)
          print('Intended screenshots captured:', len(list(target.glob('*.png'))))
          # Inspect only known static UI phrases; never print field values or raw hierarchy.
          ui = Path('/tmp/perdepro-private-hierarchy.json').read_text(errors='replace')
          known_ui = {
              'login_screen': 'Mevcut PerdePRO hesabınızla giriş yapın.',
              'admin_dashboard': 'Yönetici Paneli',
              'demo_company': 'Apple Test',
              'invalid_credentials': 'E-posta veya şifre hatalı.',
              'empty_credentials': 'E-posta ve şifre alanlarını doldurun.',
              'network_failure': 'Sunucuya bağlanılamadı.',
              'email_unconfirmed': 'E-posta adresiniz henüz doğrulanmadı.',
              'rate_limited': 'Çok fazla deneme yapıldı.',
              'license_purchase': 'Satın Al / Yükselt',
          }
          for code, phrase in known_ui.items():
              if phrase.casefold() in ui.casefold():
                  print('Safe visible UI state:', code)

          # Report only fixed command kinds and enum statuses; never command arguments.
          import json
          allowed_statuses = {'COMPLETED', 'FAILED', 'RUNNING', 'PENDING', 'SKIPPED', 'SUCCESS', 'ERROR'}
          allowed_kinds = {'launchAppCommand', 'assertConditionCommand', 'takeScreenshotCommand', 'tapOnElementCommand', 'inputTextCommand', 'hideKeyboardCommand', 'waitForAnimationToEndCommand', 'extendedWaitUntilCommand', 'applyConfigurationCommand'}
          allowed_kinds |= {kind.removesuffix('Command') for kind in allowed_kinds}
          for report in source.rglob('commands-*.json'):
              try:
                  commands = json.loads(report.read_text())
              except (ValueError, OSError):
                  continue
              if not isinstance(commands, list):
                  continue
              for index, item in enumerate(commands):
                  if not isinstance(item, dict):
                      continue
                  command = item.get('command', {})
                  metadata = item.get('metadata', {})
                  kinds = sorted(set(command) & allowed_kinds) if isinstance(command, dict) else []
                  status = metadata.get('status') if isinstance(metadata, dict) else None
                  if status in allowed_statuses:
                      print('Safe step status:', index, ','.join(kinds) or 'other', status)
          # Installer/runtime failures can happen before command JSON exists.
          log = Path('/tmp/perdepro-maestro-private.log').read_text(errors='replace')
          for marker in ['Unable to launch app', 'Element not found', 'Assertion is false', 'No devices found', 'Failed to install', 'Timeout', 'Invalid Flow File', 'Unknown option', 'Unsupported class file']:
              if marker.lower() in log.lower():
                  print('Safe failure category:', marker)

          PYCODE
          if [ "$RESULT" -ne 0 ]; then
            echo 'Native UI flow failed. Raw credential-bearing logs were kept private and are not uploaded.'
            exit "$RESULT"
          fi
          echo 'PASS: Apple Test login and module screenshots completed on iOS simulator.'
    artifacts:
      - build/ios-authenticated-screenshots/*.png

  ios-review-ipad:
    <<: *ios_review_authenticated
    name: PerdePRO iPad authenticated review screenshots
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        MAESTRO_DEVICE_FAMILY: iPad
        MAESTRO_FLOW: tests/ios/review-ipad-screenshots.yaml
