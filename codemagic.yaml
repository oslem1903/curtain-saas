# PerdePRO - Capacitor 8 iOS build
# Repository: oslem1903/curtain-saas
#
# Proje SPM tabanlidir (Capacitor 8): Podfile/.xcworkspace YOKTUR,
# bu yuzden xcodebuild'e -project verilir ve cocoapods gerekmez.
#
# İKİ IS AKISI:
#   ios-build-check -> imzasiz derleme dogrulamasi. Apple kimlik bilgisi
#                      GEREKTIRMEZ, hicbir yere yukleme YAPMAZ.
#   perdepro-ios    -> imzali IPA. Codemagic'te dagitim sertifikasi +
#                      provisioning profile tanimli olmadan CALISMAZ.

definitions:
  # Tekil adim anchorlari. DIKKAT: bir listeyi tek anchor ile yeniden
  # kullanmak (- *liste) ic ice dizi uretir ve Codemagic ayristiramaz;
  # bu yuzden her adim ayri anchorlanir.
  scripts:
    - &npm_install
      name: Install dependencies
      script: npm ci
    - &web_build
      name: Build web application
      script: npm run build
    - &cap_sync
      name: Synchronize Capacitor iOS project
      script: npx cap sync ios

workflows:
  # ───────────────────────────────────────────────────────────────────
  # 1) Imzasiz derleme dogrulamasi — su an calistirilacak olan budur
  # ───────────────────────────────────────────────────────────────────
  ios-build-check:
    name: PerdePRO iOS (imzasiz derleme kontrolu)
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      node: 24.17.0
      xcode: latest
      # Degerler Codemagic UI > Environment variables altinda saklanir;
      # bu dosyaya yazilmaz.
      groups:
        - perdepro_env

    scripts:
      - *npm_install
      - *web_build
      - *cap_sync

      - name: Archive unsigned (no Apple credentials needed)
        script: |
          set -e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee /tmp/xcodebuild_archive.log

      - name: Verify bundle metadata
        script: |
          set -e
          PLIST="$CM_BUILD_DIR/build/ios/App.xcarchive/Products/Applications/App.app/Info.plist"
          echo "--- Derlenen uygulamanin Info.plist degerleri ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName"      "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"       "$PLIST"

    artifacts:
      - build/ios/App.xcarchive
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_logs/*.log

  # ───────────────────────────────────────────────────────────────────
  # 2) Imzali IPA — Codemagic'te sertifika/profil tanimlandiktan SONRA
  #    Yukleme yok: publishing bolumu bilerek bos birakildi.
  # ───────────────────────────────────────────────────────────────────
  perdepro-ios:
    name: PerdePRO iOS (imzalı IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PerdePRO Codemagic

    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.curtainsaas.app

    scripts:
      - *npm_install
      - *web_build
      - *cap_sync
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-review-simulator:
    name: PerdePRO iOS Simulator (review screenshots)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
    scripts:
      - *npm_install
      - *web_build
      - *cap_sync
      - &ios_sim_build
        name: Build iOS simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/perdepro-simulator-build.log
      - name: Capture genuine iOS login screen
        script: |
          set -euo pipefail
          SIM_ID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          devices = [d for key, group in data['devices'].items() if 'iOS' in key for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          best = next((d for d in devices if '17 Pro Max' in d['name']), next((d for d in devices if 'Pro Max' in d['name']), devices[0]))
          print(best['udid'])
          PY
          )
          mkdir -p "$CM_BUILD_DIR/build/ios-review-screenshots"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIM_ID" "$CM_BUILD_DIR/build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$SIM_ID" com.curtainsaas.app
          # First simulator launch can spend longer loading system/WebKit caches.
          # Keep several real captures so a launch screen is never mistaken for login.
          for CAPTURE in 1 2 3; do
            sleep 30
            xcrun simctl io "$SIM_ID" screenshot "$CM_BUILD_DIR/build/ios-review-screenshots/PerdePRO-iOS-$CAPTURE.png"
          done
          xcrun simctl spawn "$SIM_ID" log show --last 3m --style compact --predicate 'process == "App"' > /tmp/perdepro-simulator-runtime.log 2>&1 || true
          xcrun simctl shutdown "$SIM_ID"
    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
      - build/ios-review-screenshots/*.png
      - /tmp/perdepro-simulator-build.log
      - /tmp/perdepro-simulator-runtime.log

  ios-review-authenticated: &ios_review_authenticated
    name: PerdePRO iOS authenticated review screenshots
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        MAESTRO_DEVICE_FAMILY: iPhone
        MAESTRO_FLOW: tests/ios/review-screenshots.yaml
    scripts:
      - &demo_credentials
        name: Check dedicated demo credentials
        script: |
          set -eu
          if [ "${MAESTRO_DEMO_EMAIL:-}" != "test0924064036@gmail.com" ] || [ -z "${MAESTRO_DEMO_PASSWORD:-}" ]; then
            echo 'Add MAESTRO_DEMO_PASSWORD as a secure variable in perdepro_env. The dedicated Apple Test email is configured by this workflow.'
            exit 1
          fi
      - *npm_install
      - &demo_auth_check
        name: Validate dedicated demo authentication without exposing credentials
        script: node tests/ios/check-demo-auth.mjs
      - *web_build
      - *cap_sync
      - *ios_sim_build
      - &maestro_install
        name: Install official Maestro CLI
        script: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
      - &maestro_capture
        name: Capture authenticated iOS module screenshots
        script: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_CLI_NO_ANALYTICS=1
          mkdir -p "$CM_BUILD_DIR/build"
          : > "$CM_BUILD_DIR/build/ios-native-review-result.txt"
          REVIEW_FAILURE=0
          for REVIEW_FAMILY in $MAESTRO_DEVICE_FAMILY; do
          echo "Review device family: $REVIEW_FAMILY"
          export MAESTRO_DEVICE_FAMILY_CURRENT="$REVIEW_FAMILY"
          export PERDEPRO_MAESTRO_PRIVATE="/tmp/perdepro-maestro-private-$REVIEW_FAMILY"
          if [ "$REVIEW_FAMILY" = iPad ]; then
            export MAESTRO_FLOW=tests/ios/review-ipad-screenshots.yaml
          else
            export MAESTRO_FLOW=tests/ios/review-screenshots.yaml
          fi
          SIM_ID=$(python3 - <<'PYCODE'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          import os
          family = os.environ['MAESTRO_DEVICE_FAMILY_CURRENT']
          devices = [d for key, group in data['devices'].items() if 'iOS' in key for d in group if d.get('isAvailable') and family in d['name']]
          if not devices:
              raise SystemExit('No available simulator for requested family')
          if family == 'iPad':
              best = next((d for d in devices if '13-inch' in d['name'] and 'Pro' in d['name']), devices[0])
          else:
              best = next((d for d in devices if '17 Pro Max' in d['name']), next((d for d in devices if 'Pro Max' in d['name']), devices[0]))
          print(best['udid'])
          PYCODE
          )
          trap 'xcrun simctl shutdown "$SIM_ID" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$CM_BUILD_DIR/build/ios-authenticated-screenshots/$REVIEW_FAMILY"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIM_ID" "$CM_BUILD_DIR/build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app"
          # Credentials come from secure MAESTRO_ environment variables, never CLI arguments.
          # Do not publish raw Maestro logs/commands: those can contain test credentials.
          RESULT=0
          maestro --device "$SIM_ID" test --test-output-dir "$PERDEPRO_MAESTRO_PRIVATE" --debug-output "$PERDEPRO_MAESTRO_PRIVATE" "$MAESTRO_FLOW" > /tmp/perdepro-maestro-private.log 2>&1 || RESULT=$?
          maestro --device "$SIM_ID" hierarchy > /tmp/perdepro-private-hierarchy.json 2>/dev/null || true
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, re, shutil
          source = Path(os.environ['PERDEPRO_MAESTRO_PRIVATE'])
          target = Path(os.environ['CM_BUILD_DIR']) / 'build/ios-authenticated-screenshots' / os.environ['MAESTRO_DEVICE_FAMILY_CURRENT']
          for image in source.rglob('*.png'):
              if re.fullmatch(r'0[1-9]-[A-Za-z]+\.png', image.name):
                  shutil.copy2(image, target / image.name)
          print('Intended screenshots captured:', len(list(target.glob('*.png'))))
          # Inspect only known static UI phrases; never print field values or raw hierarchy.
          ui = Path('/tmp/perdepro-private-hierarchy.json').read_text(errors='replace')
          import json
          try:
              ui = json.dumps(json.loads(ui), ensure_ascii=False)
          except ValueError:
              pass
          known_ui = {
              'login_screen': 'Mevcut PerdePRO hesabınızla giriş yapın.',
              'admin_dashboard': 'Yönetici Paneli',
              'demo_company': 'Apple Test',
              'invalid_credentials': 'E-posta veya şifre hatalı.',
              'empty_credentials': 'E-posta ve şifre alanlarını doldurun.',
              'network_failure': 'Sunucuya bağlanılamadı.',
              'email_unconfirmed': 'E-posta adresiniz henüz doğrulanmadı.',
              'rate_limited': 'Çok fazla deneme yapıldı.',
              'license_purchase': 'Satın Al / Yükselt',
              'email_label_upper': 'E-POSTA',
              'email_label_title': 'E-posta',
              'password_label_upper': 'ŞİFRE',
              'password_label_title': 'Şifre',
              'login_button': 'Giriş Yap',
              'invalid_email': 'Lütfen geçerli bir e-posta adresi girin.',
              'email_accessible_label': 'Giriş e-posta adresi',
              'password_accessible_label': 'Giriş şifresi',
              'submit_accessible_label': 'PerdePRO hesabına Giriş Yap',
              'demo_email_present': os.environ['MAESTRO_DEMO_EMAIL'],
          }
          for code, phrase in known_ui.items():
              if phrase.casefold() in ui.casefold():
                  print('Safe visible UI state:', code)

          # Report only fixed command kinds and enum statuses; never command arguments.
          import json
          allowed_statuses = {'COMPLETED', 'FAILED', 'RUNNING', 'PENDING', 'SKIPPED', 'SUCCESS', 'ERROR'}
          allowed_kinds = {'launchAppCommand', 'assertConditionCommand', 'takeScreenshotCommand', 'tapOnElementCommand', 'inputTextCommand', 'hideKeyboardCommand', 'waitForAnimationToEndCommand', 'extendedWaitUntilCommand', 'applyConfigurationCommand', 'tapOnPointCommand'}
          allowed_kinds |= {kind.removesuffix('Command') for kind in allowed_kinds}
          for report in source.rglob('commands*.json'):
              try:
                  commands = json.loads(report.read_text())
              except (ValueError, OSError):
                  continue
              if isinstance(commands, dict):
                  commands = commands.get('commands', [])
              if not isinstance(commands, list):
                  continue
              for index, item in enumerate(commands):
                  if not isinstance(item, dict):
                      continue
                  command = item.get('command', {})
                  metadata = item.get('metadata', {})
                  kinds = sorted(set(command) & allowed_kinds) if isinstance(command, dict) else []
                  status = metadata.get('status') if isinstance(metadata, dict) else None
                  if status in allowed_statuses:
                      print('Safe step status:', index, ','.join(kinds) or 'other', status)
                  if status == 'FAILED':
                      error = metadata.get('error', {})
                      for frame in (error.get('stackTrace', [])[:3] if isinstance(error, dict) else []):
                          cls, method = frame.get('className', ''), frame.get('methodName', '')
                          if re.fullmatch(r'[A-Za-z][A-Za-z0-9_.$]*', cls) and re.fullmatch(r'[A-Za-z][A-Za-z0-9_$-]*', method):
                              print('Safe failure stack:', cls, method)

          # Installer/runtime failures can happen before command JSON exists.
          log = Path('/tmp/perdepro-maestro-private.log').read_text(errors='replace')
          for line in log.splitlines():
              if 'assertion is false' in line.casefold():
                  for code, phrase in known_ui.items():
                      if phrase.casefold() in line.casefold():
                          print('Safe failed assertion target:', code)

          for marker in ['Unable to launch app', 'Element not found', 'Assertion is false', 'No devices found', 'Failed to install', 'Timeout', 'Invalid Flow File', 'Unknown option', 'Unsupported class file', 'NumberFormatException', 'Invalid point', 'Invalid relative point']:
              if marker.lower() in log.lower():
                  print('Safe failure category:', marker)

          PYCODE
          if [ "$RESULT" -ne 0 ]; then
            echo "FAIL:$REVIEW_FAMILY" >> "$CM_BUILD_DIR/build/ios-native-review-result.txt"
            echo 'Native UI flow failed. Raw credential-bearing logs were kept private and are not uploaded.'
            REVIEW_FAILURE=1
          else
          echo "PASS:$REVIEW_FAMILY" >> "$CM_BUILD_DIR/build/ios-native-review-result.txt"
          echo "PASS: Apple Test login and module screenshots completed on $REVIEW_FAMILY simulator."
          fi
          xcrun simctl shutdown "$SIM_ID" >/dev/null 2>&1 || true
          done
          exit "$REVIEW_FAILURE"
    artifacts:
      - build/ios-authenticated-screenshots/**/*.png

  ios-review-ipad:
    <<: *ios_review_authenticated
    name: PerdePRO iPad authenticated review screenshots
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        MAESTRO_DEVICE_FAMILY: iPad
        MAESTRO_FLOW: tests/ios/review-ipad-screenshots.yaml

  ios-review-complete:
    name: PerdePRO iOS build 22 and iPhone-iPad review screenshots
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PerdePRO Codemagic
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.curtainsaas.app
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        MAESTRO_DEVICE_FAMILY: iPhone iPad
    scripts:
      - *demo_credentials
      - *npm_install
      - *demo_auth_check
      - *web_build
      - *cap_sync
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
      - *ios_sim_build
      - *maestro_install
      - <<: *maestro_capture
        ignore_failure: true
      - name: Diagnose failed login and require genuine device checks
        script: |
          bash tests/ios/run-login-diagnostics.sh || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/ios-native-review-result.txt')
          states = p.read_text().splitlines() if p.exists() else []
          if states != ['PASS:iPhone', 'PASS:iPad']:
              raise SystemExit('Native device checks remain incomplete; diagnostic results do not count as a pass.')
          print('Both genuine simulator screenshot flows passed.')
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios-authenticated-screenshots/**/*.png
      - build/ios-native-review-result.txt
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-demo-credentials-check:
    name: PerdePRO dedicated demo authentication check
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
    scripts:
      - *demo_credentials
      - *npm_install
      - *demo_auth_check

  ios-review-demo-sync:
    name: PerdePRO synchronize validated App Review demo credential
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PerdePRO Codemagic
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        PERDEPRO_REVIEW_DEVICE_AUDIT: '1'
    scripts:
      - *demo_credentials
      - *npm_install
      - *demo_auth_check
      - name: Synchronize only the existing PerdePRO draft demo credential
        script: node tests/ios/sync-review-demo.mjs

  ios-review-ipad-release:
    name: PerdePRO iPad review screenshots and signed build 22
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PerdePRO Codemagic
    environment:
      groups:
        - perdepro_env
      node: 24.17.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.curtainsaas.app
      vars:
        MAESTRO_DEMO_EMAIL: test0924064036@gmail.com
        MAESTRO_DEVICE_FAMILY: iPad
    scripts:
      - *demo_credentials
      - *npm_install
      - *demo_auth_check
      - *web_build
      - *cap_sync
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
      - *ios_sim_build
      - *maestro_install
      - *maestro_capture
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios-authenticated-screenshots/**/*.png
      - build/ios-native-review-result.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
