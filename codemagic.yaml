# PerdePRO - Capacitor 8 iOS build
# Repository: oslem1903/curtain-saas
# Branch: master

workflows:
  perdepro-ios:
    name: PerdePRO iOS
    max_build_duration: 60

    environment:
      node: 24.17.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.curtainsaas.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web application
        script: npm run build

      - name: Synchronize Capacitor iOS project
        script: npx cap sync ios

      - name: Apply iOS signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

